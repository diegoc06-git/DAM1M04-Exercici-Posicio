<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Món Viatges - Productes</title>
  <link rel="stylesheet" href="global.css">
    <style>
    .filtres {
      display: flex;
      gap: 10px;
      margin: 20px 0;
    }
    .filtres span {
      background: #d6ebf7;
      padding: 8px 16px;
      border-radius: 20px;
      cursor: pointer;
      font-weight: bold;
    }
    .filtres span:hover {
      background: #1e6fa8;
      color: white;
    }

    .targetes {
      display: flex;
      flex-wrap: wrap;
      gap: 20px;
    }
    .targeta {
      flex: 1 1 260px;
      background: white;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
      overflow: hidden;
    }
    .imatge {
      height: 160px;
      background: #b8d9ee;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1f3a4d;
    }
    .info { padding: 15px; }
    .info h3 { margin: 0 0 8px; }
    .preu { font-weight: bold; color: #1e6fa8; }

  </style>
</head>
<body>

  <nav>
    <a href="index.html">Inici</a>
    <a href="productes.html">Productes</a>
    <a href="contacte.html">Contacte</a>
  </nav>

  <main class="contenidor">
    <h1>Les nostres destinacions</h1>

    <div class="filtres">
      <span>Tots</span>
      <span>Europa</span>
      <span>Àsia</span>
      <span>Amèrica</span>
    </div>

        <div class="targetes">
      <div class="targeta">
        <div class="imatge">Imatge</div>
        <div class="info">
          <h3>Itàlia</h3>
          <p class="preu">850 €</p>
        </div>
      </div>
      <div class="targeta">
        <div class="imatge">Imatge</div>
        <div class="info">
          <h3>Japó</h3>
          <p class="preu">1.900 €</p>
        </div>
      </div>
      <div class="targeta">
        <div class="imatge">Imatge</div>
        <div class="info">
          <h3>Mèxic</h3>
          <p class="preu">1.400 €</p>
        </div>
      </div>
    </div>

  </main>

  <footer>
    <p>&copy; 2026 Món Viatges · info@monviatges.cat</p>
  </footer>

</body>
</html>
