<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Món Viatges - Contacte</title>
  <link rel="stylesheet" href="global.css">
    <style>
    .contacte-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      margin-top: 20px;
    }
    .columna-a,
    .columna-b {
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
    }
    input,
    textarea {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
      border: 1px solid #b8d9ee;
      border-radius: 6px;
      font-family: Arial, sans-serif;
      font-size: 1rem;
    }
    form button { margin-top: 20px; }

    .mapa {
      height: 180px;
      background: #cfd8dc;
      border-radius: 8px;
      margin-top: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      color: #1f3a4d;
    }

  </style>
</head>
<body>

  <nav>
    <a href="index.html">Inici</a>
    <a href="productes.html">Productes</a>
    <a href="contacte.html">Contacte</a>
  </nav>

  <main class="contenidor">
    <h1>Contacta amb nosaltres</h1>
        <div class="contacte-grid">
      <section class="columna-a">
        <h2>Escriu-nos</h2>

        <form>
          <label for="nom">Nom</label>
          <input type="text" id="nom" name="nom">

          <label for="email">Email</label>
          <input type="email" id="email" name="email">

          <label for="missatge">Missatge</label>
          <textarea id="missatge" name="missatge" rows="5"></textarea>

          <button type="submit">Enviar</button>
        </form>

      </section>
      <section class="columna-b">
        <h2>Informació de contacte</h2>
        <p><strong>Adreça:</strong> Carrer del Món, 25, Barcelona</p>
        <p><strong>Horari:</strong> Dilluns a divendres, de 9:00 a 18:00</p>
        <p><strong>Telèfon:</strong> 93 123 45 67</p>
        <div class="mapa">Mapa</div>
      </section>
    </div>
  </main>

  <footer>
    <p>&copy; 2026 Món Viatges · info@monviatges.cat</p>
  </footer>

</body>
</html>
